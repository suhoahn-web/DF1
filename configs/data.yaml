# configs/data.yaml
# FROZEN data-handling rules. Changing anything here after final experiments start
# invalidates the freeze (CLAUDE.md §4). Record the date of any change below.
# Frozen: 2026-08-10

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  results_dir: "results"

kaggle:
  competition: "favorita-grocery-sales-forecasting"

analysis_period:
  # onpromotion is unreliably recorded before mid-2014 (~16% NaN overall,
  # concentrated early). Frozen default start: 2015-01-01.
  start: "2015-01-01"
  end: "2017-08-15"            # last date in train.csv
  # sensitivity alternative reported in appendix (do NOT tune on this):
  sensitivity_start: "2014-07-01"
  # history loaded before `start` so that lag/rolling features at early origins
  # are computable (max lag 56 + rolling 28 + margin)
  feature_buffer_days: 90

cleaning:
  clip_negative_sales_to_zero: true    # negative unit_sales = returns
  zero_fill_from_first_sale: true      # fill zeros only after series' first observed sale
  onpromotion_nan_fill: false          # after grid fill; assumption: promoted items sell >=1
                                       # (documented in paper; period restriction handles
                                       #  the systematic early-period missingness)

earthquake:
  # 2016-04-16 Ecuador earthquake demand shock
  date: "2016-04-16"
  window_days: 45                      # dummy feature active 2016-04-16 .. 2016-05-30
  treatment: "dummy"                   # frozen: keep rows, add is_earthquake_window feature
  sensitivity: "exclude_window"        # appendix-only sensitivity run

payday:
  days_of_month: [15, "last"]          # Ecuador public-sector paydays

series_eligibility:
  # computed on the analysis period only (after cleaning), frozen before experiments
  max_first_sale_date: "2016-06-30"    # ensures >=13.5 months of usable history
  min_history_days: 365                # last_date - first_sale_date >= 365
  min_nonzero_days_total: 120          # within analysis period
  min_nonzero_days_last_365: 60        # activity recency guard
  min_promo_days_total: 10             # promo-regime evaluability

sampling:
  dev_n_series: 200
  final_n_series: 3000                 # target; 1000 minimum acceptable
  stratify_by:
    promo_frequency_bins: 3            # terciles of promoted-day share
    volatility_bins: 3                 # terciles of CV_28 median
  random_seed: 20260810

forecast:
  horizon: 7
  train_origin_frequency: "W-TUE"      # weekly Tuesday origins for supervised training rows

features:
  sales_lags: [1, 2, 3, 7, 14, 21, 28, 35, 56]
  rolling_windows_mean_std: [7, 14, 28]
  rolling_windows_median: [7, 28]
  rolling_windows_maxmin: [7, 28]
  zero_ratio_window: 28
  volatility_window: 28                # CV_28 = std_28 / (mean_28 + eps)
  eps: 1.0e-6

regimes:
  post_promotion_days: [1, 3]          # calendar window after a promotion ends
  post_promotion_sensitivity: [1, 7]   # appendix sensitivity
  high_volatility_quantile: 0.75       # threshold from TRAINING data only

# Rolling-origin evaluation design (frozen).
# Each fold = 28-day validation window with 4 weekly origins; forecasts cover
# origin+1 .. origin+7. Holdout is used ONCE after all model choices are frozen.
splits:
  folds:
    fold1: { origins: ["2017-04-25", "2017-05-02", "2017-05-09", "2017-05-16"] }
    fold2: { origins: ["2017-05-23", "2017-05-30", "2017-06-06", "2017-06-13"] }
    fold3: { origins: ["2017-06-20", "2017-06-27", "2017-07-04", "2017-07-11"] }
  holdout:
    origins: ["2017-07-18", "2017-07-25", "2017-08-01", "2017-08-08"]
  # temporal OOF period for residual/gate training (base model retrained monthly,
  # expanding window; every OOF prediction comes from a base trained on earlier data)
  oof:
    first_origin: "2016-03-01"
    last_origin: "2017-08-08"          # extended through holdout origins so the
                                       # rolling residual INPUT stream exists at
                                       # every fold/holdout origin (observable at
                                       # forecast time: a system knows its own
                                       # past errors). TRAINING uses only stages
                                       # below; origins after train_last_origin
                                       # are stage "eval_input" and are never
                                       # used as TCN/gate training targets.
    train_last_origin: "2017-04-18"    # strictly before fold1
    origin_frequency: "W-TUE"
    base_retrain_frequency: "MS"       # month starts
    # TCN -> gate separation (MODEL_ARCHITECTURE_SPEC §3):
    tcn_train_end: "2016-12-27"        # ~70% of training OOF origins train the TCN
    gate_train_start: "2017-01-03"     # later ~30% provides TCN out-of-sample preds
